# Name:        build.yml
# Description: builds the game on clean machines with no ROM set (Linux with GCC, macOS with Clang,
#              Windows with MSVC), SDL2 inside the executables, and packs what a player runs: the window
#              ports, OutRunners Arcade and OutRunners, which take their assets out of the player's ROM set
#              on their first run; the Nintendo Switch's .nsp pieces with devkitPro's toolchain, Android's game
#              without a pack with the NDK and Anbernic's handhelds' game with Zig, each in a package of its own
#              (Sebas, 09-11-2026: not inside the computers' packages) beside the tool that makes the player's
#              .nsp, APK or PORTS of it, for the three computers; with their licenses. A tag v* makes a release
#              of those six packages. It runs on main, its pull requests and the tags v* alone (Sebas,
#              30-10-2026: not on the other branches); by hand on any branch. And on the newest Ubuntu, as the
#              README builds there (its GCC, Python and SDL2)
# Version:     0.3.0
# Created:     27-10-2026
# Modified:    09-11-2026
# Author:      Sebastian Toyos
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-universal
            os: macos-15    # (GitHub retires macos-14 on 2 November 2026; the .app is still for macOS 11 on)
          - name: windows-x64
            os: windows-2022
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      # (tools/core, the shared core, holds the licenses of MAME's and ymfm's code the board follows)
      - uses: actions/checkout@v7
        with:
          submodules: true

      # SDL2 is built from its source (ORUNNERS_STATIC_SDL2): on Linux it needs the headers of what it talks
      # to (it loads the libraries themselves when the game runs)
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libudev-dev libdbus-1-dev

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DORUNNERS_REFERENCE_TOOLS=OFF -DORUNNERS_STATIC_SDL2=ON

      - name: Configure (macOS, Apple silicon and Intel)
        if: runner.os == 'macOS'
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DORUNNERS_REFERENCE_TOOLS=OFF -DORUNNERS_STATIC_SDL2=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build/cmake -DORUNNERS_REFERENCE_TOOLS=OFF -DORUNNERS_STATIC_SDL2=ON

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      # what a player runs (no headless runs, no build leftovers), in an archive of our own: the artifacts'
      # zip loses the executables' permissions. With it, the terms the executables come with: the project's,
      # MAME's and ymfm's (BSD-3: the board's libraries follow their behavior and tables), SDL2's (zlib) and
      # Kenney's (CC0: the letters of the windows, the controls' pictures), and the package's README.
      # The .apps are signed ad hoc (no certificate): macOS then offers to open them anyway, where a bundle
      # signed in part is "damaged". The devices' tools (OutRunners NSP, APK, Anbernic) go to the kit, with
      # font.bmp and the licenses, for the devices' packages (the job devices)
      - name: Pack
        shell: bash
        run: |
          mkdir -p dist/outrunners/licenses dist/kit
          for file in build/bin/*; do
            case "$(basename "$file")" in
              *headless*|*.pdb|*.ilk|*.exp|*.lib|*.a|switch|android|anbernic) ;;
              "OutRunners NSP"*|"OutRunners APK"*|"OutRunners Anbernic"*) cp "$file" dist/kit/ ;;
              *) cp -R "$file" dist/outrunners/ ;;
            esac
          done
          cp LICENSE dist/outrunners/LICENSE.txt
          cp docs/package/README.txt dist/outrunners/README.txt
          cp tools/core/system32/reference/mame/LICENSE dist/outrunners/licenses/MAME.txt
          cp tools/core/system32/reference/ymfm/LICENSE dist/outrunners/licenses/ymfm.txt
          cp build/cmake/_deps/sdl2-src/LICENSE.txt dist/outrunners/licenses/SDL2.txt
          cp lan/LICENSE dist/outrunners/licenses/arcade-lan.txt
          cp ports/sdl2/font/License.txt dist/outrunners/licenses/Kenney-Mini.txt
          cp ports/sdl2/prompts/License.txt dist/outrunners/licenses/Kenney-Input-Prompts.txt
          if [ "$RUNNER_OS" = macOS ]; then
            for app in dist/outrunners/*.app; do
              codesign --force --deep --sign - "$app"
              codesign --verify --deep --strict --verbose=2 "$app"
            done
          fi
          cp -R dist/outrunners/licenses dist/kit/
          cp LICENSE dist/kit/LICENSE.txt
          cp ports/sdl2/font/font.bmp dist/kit/    # (on macOS it is inside the .apps alone)
          ls -la dist/outrunners dist/outrunners/licenses dist/kit
          cd dist
          case "$RUNNER_OS" in
            Linux) tar czf outrunners-${{ matrix.name }}.tar.gz outrunners ;;
            macOS) ditto -c -k --keepParent outrunners outrunners-${{ matrix.name }}.zip ;;
            Windows) 7z a -tzip outrunners-${{ matrix.name }}.zip outrunners ;;
          esac
          tar czf outrunners-${{ matrix.name }}-kit.tar.gz kit
          cd ..
          tar czf dist/outrunners-${{ matrix.name }}-all.tar.gz -C build bin

      - uses: actions/upload-artifact@v7
        with:
          name: outrunners-${{ matrix.name }}
          path: |
            dist/outrunners-${{ matrix.name }}.*
            dist/outrunners-${{ matrix.name }}-kit.tar.gz
            dist/outrunners-${{ matrix.name }}-all.tar.gz

  # The Nintendo Switch: the .nsp's pieces (main, main.npdm, control.nacp, icon.jpg), with devkitPro's
  # toolchain in its own image (no .nro: that one carries a player's assets)
  switch:
    name: switch
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # (lan/: arcade-lan, the network's)

      - name: Configure
        run: /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -S . -B build/switch -DCMAKE_BUILD_TYPE=Release -DORUNNERS_REFERENCE_TOOLS=OFF

      - name: Build
        run: cmake --build build/switch --target OutRunners_switch --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: outrunners-switch
          path: build/bin/switch/

  # Android: the game without an assets pack or a signature (build/bin/android/outrunners-base.apk), with
  # the NDK and the SDK's tools of the runner's Android SDK and its Java 17 (ports/android/android.cmake)
  android:
    name: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # (lan/: arcade-lan, the network's)

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.1" > /dev/null

      - name: Configure
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cmake -S . -B build/android -G Ninja -DCMAKE_BUILD_TYPE=Release -DORUNNERS_REFERENCE_TOOLS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24

      - name: Build
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cmake --build build/android --target orunners_apk --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: outrunners-android
          path: build/bin/android/outrunners-base.apk    # (the game alone: not the runner's own APK beside it)

  # Anbernic's H700 handhelds: PORTS's files without the assets (build/bin/anbernic), built with Zig for the
  # stock firmware's glibc and against its SDL2 (SDL's headers from its source; ports/anbernic/anbernic.cmake)
  anbernic:
    name: anbernic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # (lan/: arcade-lan, the network's)

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          mkdir -p build/downloads/zig build/downloads/sdl2-source
          curl -fsSL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz | tar xJ -C build/downloads/zig
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz \
            | tar xz -C build/downloads/sdl2-source

      - name: Configure
        run: |
          cmake -S . -B build/anbernic -G Ninja -DCMAKE_BUILD_TYPE=Release -DORUNNERS_REFERENCE_TOOLS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=ports/anbernic/zig_aarch64.cmake -DORUNNERS_ANBERNIC=ON \
            -DORUNNERS_SDL2_INCLUDE="$PWD/build/downloads/sdl2-source/SDL2-2.32.10/include"

      - name: Build
        run: cmake --build build/anbernic --target OutRunners --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: outrunners-anbernic
          path: build/bin/anbernic/

  # The devices' packages (ports/pack_devices.py): outrunners-switch.zip, outrunners-android.zip and
  # outrunners-anbernic.zip, each the device's game beside its tool for Windows, macOS and Linux (the
  # computers' kits), font.bmp, the licenses and its README (docs/package)
  devices:
    name: devices
    runs-on: ubuntu-24.04
    needs: [build, switch, android, anbernic]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: outrunners-switch
          path: devices/switch

      - uses: actions/download-artifact@v8
        with:
          name: outrunners-android
          path: devices/android

      - uses: actions/download-artifact@v8
        with:
          name: outrunners-anbernic
          path: devices/anbernic

      - uses: actions/download-artifact@v8
        with:
          name: outrunners-windows-x64
          path: computers/windows-x64

      - uses: actions/download-artifact@v8
        with:
          name: outrunners-macos-universal
          path: computers/macos-universal

      - uses: actions/download-artifact@v8
        with:
          name: outrunners-linux-x64
          path: computers/linux-x64

      - name: Pack
        run: |
          for computer in windows-x64 macos-universal linux-x64; do
            mkdir -p "kits/$computer"
            tar xzf "computers/$computer/outrunners-$computer-kit.tar.gz" -C "kits/$computer"
          done
          python3 ports/pack_devices.py --kits kits --switch devices/switch --android devices/android \
            --anbernic devices/anbernic --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: outrunners-devices
          path: dist/outrunners-*.zip

  # The newest Ubuntu (ubuntu:rolling) with its own GCC, Python and SDL2, built as the README says: the
  # games and the reference tools on MAME's code too, which a newer GCC breaks first (issue 6), and the
  # tools' Python compiled with its warnings as errors. No ROM set: nothing runs, and no release waits on it
  linux-newest:
    name: linux-newest
    runs-on: ubuntu-24.04
    container: ubuntu:rolling
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # (git before the checkout, which otherwise fetches the files without the submodule)
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake python3 libsdl2-dev
          gcc --version | head -1
          python3 --version

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build/cmake

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      - name: Python
        run: python3 -W error -m compileall -q tools extract_assets.py

  # A tag v*: the packages as a GitHub release, its notes from docs/releases/TAG.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, devices]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: outrunners-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OutRunners $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            dist/outrunners-windows-x64.zip dist/outrunners-linux-x64.tar.gz dist/outrunners-macos-universal.zip \
            dist/outrunners-switch.zip dist/outrunners-android.zip dist/outrunners-anbernic.zip
